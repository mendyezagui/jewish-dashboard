<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jewish Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%2780%27 font-size=%2780%27>&#10017;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fafaf9;
  --bg-grad-from:#ffffff;
  --bg-grad-to:#f5f5f4;
  --card:#ffffff;
  --card-2:#fafaf9;
  --border:#e7e5e4;
  --border-strong:#d6d3d1;
  --text:#18181b;
  --text-2:#52525b;
  --text-3:#a1a1aa;
  --gold:#b08c00;
  --gold-strong:#92710a;
  --gold-bg:#fef9e7;
  --teal:#0e7490;
  --teal-bg:#ecfeff;
  --purple:#7c3aed;
  --purple-bg:#f5f3ff;
  --warm:#c2410c;
  --warm-bg:#fff7ed;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --green:#15803d;
  --green-bg:#f0fdf4;
  --shadow:0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse at 50% -10%,var(--bg-grad-from) 0%,var(--bg-grad-to) 70%)}
/* CRITICAL: minmax(0,1fr) lets the row shrink so children with overflow:auto can scroll */
.dashboard{display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(0.7rem,1.1vw,1.4rem);height:100vh;padding:clamp(0.9rem,1.7vw,2rem)}
/* ------- Top bar: clock left, center info, Rebbe video right ------- */
.topbar{display:grid;grid-template-columns:auto 1fr clamp(220px,22vw,320px);gap:clamp(0.9rem,1.6vw,1.8rem);align-items:stretch;height:clamp(110px,15vh,170px)}
.tb-clock{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 clamp(0.4rem,0.6vw,0.8rem);min-width:clamp(160px,18vw,260px)}
.clock{font-size:clamp(2.2rem,4vw,4.6rem);font-weight:800;line-height:1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#18181b 20%,#52525b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.clock .ampm{font-size:0.34em;font-weight:600;-webkit-text-fill-color:#a1a1aa;margin-left:0.18em}
.tb-clock-sub{font-size:clamp(0.78rem,1.05vw,1.18rem);color:var(--text-2);font-weight:500;margin-top:0.15rem;letter-spacing:0.01em}
.tb-center{display:flex;flex-direction:column;justify-content:center;gap:clamp(0.25rem,0.45vh,0.5rem);min-width:0}
.eng-date{font-size:clamp(1rem,1.5vw,1.7rem);font-weight:600;color:var(--text);letter-spacing:-0.005em}
.heb-line{display:flex;align-items:baseline;gap:clamp(0.4rem,0.7vw,0.9rem);flex-wrap:wrap}
.heb-txt{font-family:'Heebo',sans-serif;font-size:clamp(0.95rem,1.4vw,1.55rem);font-weight:700;color:var(--gold-strong);direction:rtl}
.heb-sep{color:var(--text-3);font-size:clamp(0.6rem,0.8vw,0.9rem)}
.heb-en{font-size:clamp(0.85rem,1.2vw,1.35rem);font-weight:500;color:var(--gold);opacity:0.9}
.badges{display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap;margin-top:0.05rem}
.badge{display:inline-block;padding:0.18em 0.7em;border-radius:999px;font-size:clamp(0.65rem,0.82vw,0.92rem);font-weight:600;border:1px solid transparent}
.badge-gold{background:var(--gold-bg);color:var(--gold-strong);border-color:rgba(176,140,0,0.18)}
.badge-purple{background:var(--purple-bg);color:var(--purple);border-color:rgba(124,58,237,0.16)}
.tb-video{position:relative;border-radius:clamp(0.85rem,1.1vw,1.2rem);overflow:hidden;background:#000;border:1px solid var(--border);box-shadow:var(--shadow)}
.tb-video iframe{width:100%;height:100%;border:none;display:block}
.tb-video .vimg{width:100%;height:100%;background:#000 center/cover no-repeat;position:relative}
.tb-video .vimg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,0.65) 100%);pointer-events:none}
.tb-video .vimg-caption{position:absolute;bottom:0.55rem;left:0;right:0;text-align:center;color:#fef9e7;font-size:clamp(0.78rem,1vw,1.05rem);font-weight:600;letter-spacing:0.04em;text-shadow:0 2px 8px rgba(0,0,0,0.6);z-index:1}
/* ------- Body: 2 cols (minmax(0,...) so columns can shrink for overflow) ------- */
.body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(0.7rem,1.1vw,1.4rem);min-height:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:clamp(0.9rem,1.2vw,1.3rem);padding:clamp(0.9rem,1.3vw,1.7rem);box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.ctitle{font-size:clamp(0.62rem,0.82vw,0.92rem);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:clamp(0.5rem,0.8vh,0.95rem);display:flex;align-items:center;gap:0.5rem;color:var(--text-2)}
.ctitle .ic{font-size:clamp(0.85rem,1.05vw,1.2rem)}
.lcol{display:flex;flex-direction:column;gap:clamp(0.7rem,1.1vw,1.4rem);min-height:0;min-width:0}
.hycard{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#fffdf6 0%,#ffffff 70%)}
.hycard::before{background:linear-gradient(90deg,#d4a017,#b08c00)}
.hycard .ctitle{color:var(--gold-strong)}
.hyref{font-size:clamp(0.62rem,0.78vw,0.85rem);color:var(--text-3);font-style:italic;margin-bottom:clamp(0.3rem,0.5vh,0.6rem)}
.hybody{font-size:clamp(1.05rem,1.32vw,1.55rem);line-height:1.75;color:var(--text);flex:1 1 0;min-height:0;overflow-y:auto;padding-right:0.4rem}
.hybody::-webkit-scrollbar{width:6px}
.hybody::-webkit-scrollbar-track{background:transparent}
.hybody::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.hybody em,.hybody i{color:var(--gold-strong);font-style:italic}
.hy-he{font-family:'Heebo',sans-serif;font-size:clamp(0.85rem,1.05vw,1.25rem);line-height:1.85;color:var(--text-2);direction:rtl;text-align:right;border-top:1px solid var(--border);margin-top:clamp(0.6rem,0.8vh,1rem);padding-top:clamp(0.6rem,0.8vh,1rem)}
/* ------- Sports: live marquee ticker (smallest section) ------- */
.spcard{flex:0 0 auto;padding:clamp(0.5rem,0.8vw,0.9rem) 0;overflow:hidden}
.spcard::before{background:linear-gradient(90deg,#0891b2,#0e7490)}
.spcard .ctitle{color:var(--teal);margin:0 clamp(0.85rem,1.2vw,1.4rem) clamp(0.35rem,0.5vh,0.55rem);font-size:clamp(0.58rem,0.75vw,0.85rem)}
.ticker-frame{position:relative;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 4%,#000 96%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 4%,#000 96%,transparent 100%)}
.ticker-track{display:inline-flex;align-items:center;gap:clamp(1.5rem,2.5vw,3rem);animation:tickerScroll 55s linear infinite;font-variant-numeric:tabular-nums;font-size:clamp(0.88rem,1.1vw,1.2rem);padding-left:100%;will-change:transform}
.ticker-track:hover{animation-play-state:paused}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.t-item{display:inline-flex;align-items:center;gap:0.55em;white-space:nowrap}
.t-icon{font-size:1.15em;line-height:1}
.t-name{font-weight:700;letter-spacing:0.02em;color:var(--text)}
.t-name.dodgers{color:#0a4ea8}
.t-name.lakers{color:#552583}
.t-tag{display:inline-flex;align-items:center;gap:0.3em;font-size:0.78em;font-weight:700;letter-spacing:0.05em;padding:0.12em 0.55em;border-radius:999px;border:1px solid transparent;text-transform:uppercase}
.t-tag.live{background:var(--red-bg);color:var(--red);border-color:rgba(220,38,38,0.18)}
.t-tag.live::before{content:'';display:inline-block;width:0.45em;height:0.45em;border-radius:50%;background:var(--red);animation:pulseDot 1.4s ease-in-out infinite}
.t-tag.win{background:var(--green-bg);color:var(--green);border-color:rgba(21,128,61,0.18)}
.t-tag.loss{background:var(--red-bg);color:var(--red);border-color:rgba(220,38,38,0.18)}
.t-tag.next{background:var(--teal-bg);color:var(--teal);border-color:rgba(14,116,144,0.18)}
.t-score{font-weight:800;color:var(--text)}
.t-score.win{color:var(--green)}
.t-score.loss{color:var(--red)}
.t-score.live{color:var(--red)}
.t-vs{color:var(--text-2);font-weight:500}
.t-when{color:var(--text-3);font-size:0.92em}
.t-dot{color:var(--border-strong);font-size:0.7em;margin:0 0.2em}
.t-empty{color:var(--text-3);font-style:italic;padding:0 1rem}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.35}}
/* ------- Right column: each card scrolls independently ------- */
.rcol{display:flex;flex-direction:column;gap:clamp(0.7rem,1.1vw,1.4rem);min-height:0;min-width:0}
.rcol > .card{display:flex;flex-direction:column;min-height:0;flex:1 1 0}
.rcol > .card > #learn,
.rcol > .card > #zmanim,
.rcol > .card > #sTimes{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:0.4rem;margin-right:-0.2rem}
.rcol > .card > #learn::-webkit-scrollbar,
.rcol > .card > #zmanim::-webkit-scrollbar,
.rcol > .card > #sTimes::-webkit-scrollbar{width:6px}
.rcol > .card > #learn::-webkit-scrollbar-track,
.rcol > .card > #zmanim::-webkit-scrollbar-track,
.rcol > .card > #sTimes::-webkit-scrollbar-track{background:transparent}
.rcol > .card > #learn::-webkit-scrollbar-thumb,
.rcol > .card > #zmanim::-webkit-scrollbar-thumb,
.rcol > .card > #sTimes::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.lcard::before{background:linear-gradient(90deg,#06b6d4,#0e7490)}
.lcard .ctitle{color:var(--teal)}
.litem{display:flex;align-items:baseline;gap:0.5rem;padding:clamp(0.34rem,0.5vh,0.6rem) 0;border-bottom:1px solid var(--border)}
.litem:last-child{border-bottom:none}
.llbl{font-size:clamp(0.7rem,0.86vw,0.96rem);font-weight:700;color:var(--teal);white-space:nowrap;min-width:clamp(4.2rem,5.4vw,6.4rem);text-transform:uppercase;letter-spacing:0.03em}
.lval{font-size:clamp(0.86rem,1.05vw,1.18rem);color:var(--text)}
.zcard::before{background:linear-gradient(90deg,#a78bfa,#7c3aed)}
.zcard .ctitle{color:var(--purple)}
.zgrid{display:grid;grid-template-columns:1fr 1fr;gap:0.45rem 1.3rem}
.zitem{display:flex;justify-content:space-between;align-items:baseline;padding:clamp(0.25rem,0.38vh,0.45rem) 0;border-bottom:1px solid var(--border)}
.zlbl{font-size:clamp(0.72rem,0.88vw,1rem);color:var(--text-2);font-weight:500}
.zval{font-size:clamp(0.86rem,1.05vw,1.18rem);color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.scard{background:linear-gradient(180deg,#fffaf3 0%,#ffffff 70%);border-color:#fde4cc}
.scard::before{background:linear-gradient(90deg,#fb923c,#c2410c)}
.scard .ctitle{color:var(--warm)}
.sitem{display:flex;justify-content:space-between;align-items:center;padding:clamp(0.28rem,0.44vh,0.55rem) 0}
.slbl{font-size:clamp(0.86rem,1.05vw,1.18rem);color:var(--text-2)}
.stm{font-size:clamp(1.05rem,1.3vw,1.55rem);font-weight:700;color:var(--warm);font-variant-numeric:tabular-nums}
.sparsha{text-align:center;font-size:clamp(0.86rem,1.05vw,1.2rem);color:var(--text-2);margin-top:0.3rem;padding-top:0.4rem;border-top:1px solid #fde4cc}
.loading{color:var(--text-3);font-style:italic;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.err{color:var(--text-3);font-style:italic}
.err a{color:var(--gold);text-decoration:none}
.err a:hover{text-decoration:underline}
.hidden{display:none !important}
.fadein{animation:fi .5s ease-out forwards}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1024px){
  .topbar{grid-template-columns:1fr;height:auto}
  .tb-video{height:clamp(140px,22vh,200px)}
  .body{grid-template-columns:1fr;height:auto;min-height:60vh}
  html,body{overflow:auto;height:auto}
  .dashboard{height:auto;min-height:100vh}
  /* On mobile, page scrolls — cards size to content, no internal scroll */
  .rcol > .card{flex:0 0 auto}
  .rcol > .card > #learn,
  .rcol > .card > #zmanim,
  .rcol > .card > #sTimes{overflow-y:visible;max-height:none}
}
@media(max-width:600px){.dashboard{padding:0.8rem}.clock{font-size:2.4rem}}
</style>
</head>
<body>
<div class="dashboard">
  <header class="topbar">
    <div class="tb-clock">
      <div class="clock" id="clock">--:--</div>
      <div class="tb-clock-sub" id="tbClockSub">Los Angeles</div>
    </div>
    <div class="tb-center">
      <div class="eng-date" id="engDate"></div>
      <div class="heb-line">
        <span class="heb-txt" id="hebTxt"></span>
        <span class="heb-sep" id="hebSep"></span>
        <span class="heb-en" id="hebEn"></span>
      </div>
      <div class="badges" id="badges"></div>
    </div>
    <div class="tb-video" id="vCard">
      <iframe id="vid" src="https://www.youtube.com/embed/vCtCh28Af2w?autoplay=1&mute=1&loop=1&playlist=vCtCh28Af2w&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&disablekb=1" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>
      <div id="vImage" class="vimg hidden"></div>
    </div>
  </header>
  <div class="body">
    <div class="lcol">
      <section class="card hycard">
        <div class="ctitle"><span class="ic">&#10017;</span> Hayom Yom</div>
        <div class="hyref" id="hyRef"></div>
        <div class="hybody" id="hyBody"><span class="loading">Loading today&#39;s teaching&#8230;</span></div>
      </section>
      <section class="card spcard">
        <div class="ctitle"><span class="ic">&#127942;</span> Scores &middot; Los Angeles</div>
        <div class="ticker-frame">
          <div class="ticker-track" id="scoresTicker"><span class="t-empty loading">Loading scores&#8230;</span></div>
        </div>
      </section>
    </div>
    <div class="rcol">
      <section class="card lcard">
        <div class="ctitle"><span class="ic">&#128214;</span> Daily Learning</div>
        <div id="learn"><span class="loading">Loading schedule&#8230;</span></div>
      </section>
      <section class="card zcard">
        <div class="ctitle"><span class="ic">&#9728;&#65039;</span> Zmanim &middot; Los Angeles</div>
        <div id="zmanim"><span class="loading">Loading zmanim&#8230;</span></div>
      </section>
      <section class="card scard hidden" id="sCard">
        <div class="ctitle"><span class="ic">&#128367;&#65039;</span> <span id="sTitle">Shabbos Times</span></div>
        <div id="sTimes"></div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
var TZ='America/Los_Angeles',ZIP='90035',REFRESH=3600000,SCORES_REFRESH_LIVE=60000,SCORES_REFRESH_IDLE=300000;
var TEHILLIM={1:'1-9',2:'10-17',3:'18-22',4:'23-28',5:'29-34',6:'35-38',7:'39-43',8:'44-48',9:'49-54',10:'55-59',11:'60-65',12:'66-68',13:'69-71',14:'72-76',15:'77-78',16:'79-82',17:'83-87',18:'88-89',19:'90-96',20:'97-103',21:'104-105',22:'106-107',23:'108-112',24:'113-118',25:'119:1-58',26:'119:59-117',27:'119:118-176',28:'120-134',29:'135-139',30:'140-150'};
var ALIYAH=['Rishon','Sheni','Shlishi',"Revi'i",'Chamishi','Shishi',"Shevi'i"];
var hebData=null;
var scoresTimer=null;
function g(id){return document.getElementById(id)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ})}catch(e){return iso}}
function fmtDayTime(iso){try{var d=new Date(iso);var dow=d.toLocaleDateString('en-US',{weekday:'short',timeZone:TZ});var t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ}).toLowerCase().replace(' ','');return dow+' '+t}catch(e){return iso}}
function tick(){
  var now=new Date();
  var h=now.toLocaleString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:TZ});
  var parts=h.split(/(AM|PM)/i);
  if(parts.length>=2){g('clock').innerHTML=parts[0].trim()+'<span class="ampm">'+parts[1]+'</span>'}
  else{g('clock').textContent=h}
  g('engDate').textContent=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:TZ});
}
setInterval(tick,1000);tick();
// ---- Auto-scroll: smoothly scrolls a card's content up & down when it overflows ----
function autoScroll(elId, speedPxPerSec){
  var el=g(elId);
  if(!el) return;
  // Cancel prior animation + listeners
  if(el._asRaf){cancelAnimationFrame(el._asRaf);el._asRaf=null}
  if(el._asEnter){el.removeEventListener('mouseenter',el._asEnter);el._asEnter=null}
  if(el._asLeave){el.removeEventListener('mouseleave',el._asLeave);el._asLeave=null}
  el.scrollTop=0;
  // No animation if content fits comfortably
  if(el.scrollHeight - el.clientHeight < 6) return;
  var speed=speedPxPerSec||35; // px/sec — visible from across a room
  var endPause=2000; // ms pause at top/bottom so viewers see start/end
  var dir=1, hovered=false, pausedUntil=performance.now()+700, last=performance.now();
  function step(now){
    if(!hovered && now>pausedUntil){
      var max=el.scrollHeight-el.clientHeight;
      var dt=Math.min(0.05,(now-last)/1000);
      el.scrollTop += dir*speed*dt;
      if(el.scrollTop>=max && dir>0){el.scrollTop=max;dir=-1;pausedUntil=now+endPause}
      else if(el.scrollTop<=0 && dir<0){el.scrollTop=0;dir=1;pausedUntil=now+endPause}
    }
    last=now;
    el._asRaf=requestAnimationFrame(step);
  }
  el._asEnter=function(){hovered=true};
  el._asLeave=function(){hovered=false;last=performance.now()};
  el.addEventListener('mouseenter',el._asEnter);
  el.addEventListener('mouseleave',el._asLeave);
  el._asRaf=requestAnimationFrame(step);
}
function autoScrollAll(){
  // Slight delay so layout settles after innerHTML changes
  setTimeout(function(){
    autoScroll('hyBody', 38);
    autoScroll('learn', 28);
    autoScroll('zmanim', 28);
  },200);
}
(function(){
  var t;
  window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(autoScrollAll,300)});
})();
function omerDay(mo,d){if(mo==='Nisan'&&d>=16)return d-15;if(mo==='Iyyar')return 15+d;if(mo==='Sivan'&&d<=5)return 44+d;return null}
function fetchHebDate(){
  var now=new Date(),ds=now.toLocaleDateString('en-CA',{timeZone:TZ});
  return fetch('https://www.hebcal.com/converter?cfg=json&date='+ds+'&g2h=1&strict=1')
    .then(function(r){return r.json()}).then(function(d){
      hebData=d;
      g('hebTxt').textContent=d.hebrew||'';
      g('hebSep').textContent='•';
      g('hebEn').textContent=d.hd+' '+d.hm+', '+d.hy;
      var badges='';
      var omerCalc=omerDay(d.hm,d.hd);
      if(d.events&&d.events.length){
        d.events.forEach(function(e){
          if(omerCalc!==null && /omer/i.test(e)) return;
          badges+='<span class="badge badge-gold">'+esc(e)+'</span>';
        });
      }
      if(omerCalc!==null){
        var w=Math.floor(omerCalc/7),r2=omerCalc%7;
        var wk=w>0?(w+(w===1?' week':' weeks')):'';
        var dy=r2>0?(r2+(r2===1?' day':' days')):'';
        var os='Day '+omerCalc+' of the Omer';
        if(wk||dy)os+=' ('+[wk,dy].filter(Boolean).join(', ')+')';
        badges+='<span class="badge badge-purple">'+esc(os)+'</span>';
      }
      g('badges').innerHTML=badges;return d;
    }).catch(function(e){console.error('Heb date err:',e);g('hebEn').textContent='Unable to load Hebrew date'});
}
function fetchHY(){
  if(!hebData)return Promise.resolve();
  g('hyRef').textContent=hebData.hd+' '+hebData.hm+', '+hebData.hy;
  return fetch('/api/hayomyom?tz='+encodeURIComponent(TZ))
    .then(function(r){return r.json()}).then(function(d){
      var en=d.teaching_en||'';
      var he=d.teaching_he||'';
      if(!en && !he){
        g('hyBody').innerHTML='<div class="err" style="text-align:center;padding:1rem">Hayom Yom not available for today</div>';
        return;
      }
      var html='<div class="fadein">';
      if(d.dateHeader){
        html+='<div style="font-size:0.95rem;color:var(--text-2);margin-bottom:0.5rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)">'+esc(d.dateHeader)+'</div>';
      }
      if(en) html+='<div>'+esc(en).replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')+'</div>';
      html+='</div>';
      if(he){
        html+='<div class="hy-he fadein">';
        if(d.hebrewDate)html+='<div style="font-size:0.85rem;opacity:0.7;margin-bottom:0.4rem">'+esc(d.hebrewDate)+'</div>';
        html+=esc(he).replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
        html+='</div>';
      }
      g('hyBody').innerHTML=html;
    }).catch(function(){
      g('hyBody').innerHTML='<div class="err" style="text-align:center;padding:1rem">Unable to load Hayom Yom</div>';
    });
}
function fetchLearn(){
  var el=g('learn'),now=new Date(),laD=new Date(now.toLocaleString('en-US',{timeZone:TZ})),dow=laD.getDay();
  return fetch('https://www.sefaria.org/api/calendars').then(function(r){return r.json()}).then(function(data){
    var items=[];
    if(data.calendar_items){
      var p=data.calendar_items.find(function(i){return i.title&&i.title.en==='Parashat Hashavua'});
      if(p){var nm=p.displayValue?p.displayValue.en:(p.ref||'');items.push({l:'Chumash',v:nm+' — '+ALIYAH[dow]})}
      if(hebData){var th=TEHILLIM[hebData.hd]||TEHILLIM[30];items.push({l:'Tehillim',v:'Psalms '+th})}
      var ty=data.calendar_items.find(function(i){return i.title&&i.title.en==='Tanya Yomi'});
      if(ty){
        var tv='';
        if(ty.ref){tv=ty.ref.replace(/^Tanya,?\s*/,'').replace(/Part I;?\s*/,'').replace(/Part II;?\s*/,'Iggeret HaKodesh ').replace(/;\s*/g,', ');}
        else if(ty.displayValue&&ty.displayValue.en)tv=ty.displayValue.en;
        items.push({l:'Tanya',v:tv});
      }
      var rm1=data.calendar_items.find(function(i){return i.title&&i.title.en==='Daily Rambam'});
      if(rm1){var v1=rm1.displayValue?rm1.displayValue.en:(rm1.ref||'');items.push({l:'Rambam (1 ch)',v:v1});}
      var rm3=data.calendar_items.filter(function(i){return i.title&&i.title.en==='Daily Rambam (3 Chapters)'});
      if(rm3.length){var v3=rm3.map(function(i){return i.displayValue?i.displayValue.en:(i.ref||'')}).filter(Boolean).join('; ');items.push({l:'Rambam (3 ch)',v:v3});}
      var df=data.calendar_items.find(function(i){return i.title&&i.title.en==='Daf Yomi'});
      if(df)items.push({l:'Daf Yomi',v:df.displayValue?df.displayValue.en:(df.ref||'')});
    }
    if(!items.length)items.push({l:'Info',v:'Unable to load schedule'});
    el.innerHTML=items.map(function(it){return '<div class="litem fadein"><span class="llbl">'+esc(it.l)+'</span><span class="lval">'+esc(it.v)+'</span></div>'}).join('');
  }).catch(function(){el.innerHTML='<span class="err">Unable to load daily learning</span>'});
}
var shabbosTimes={candleLighting:null,havdalah:null};
function fetchShabbos(){
  var card=g('sCard'),el=g('sTimes'),titleEl=g('sTitle');
  var now=new Date(),todayStr=now.toLocaleDateString('en-CA',{timeZone:TZ});
  var dow=now.toLocaleDateString('en-US',{weekday:'long',timeZone:TZ});
  var isFri=dow==='Friday',isSat=dow==='Saturday';
  return fetch('https://www.hebcal.com/shabbat?cfg=json&zip='+ZIP+'&M=on').then(function(r){return r.json()}).then(function(data){
    if(!data.items||!data.items.length){card.classList.add('hidden');return}
    var candleToday=false,hasHoliday=false;
    shabbosTimes.candleLighting=null;shabbosTimes.havdalah=null;
    data.items.forEach(function(it){
      var dd=it.date?it.date.substring(0,10):'';
      if(dd===todayStr&&it.category==='candles')candleToday=true;
      if(it.yomtov&&dd===todayStr)hasHoliday=true;
      if(it.category==='candles'&&!shabbosTimes.candleLighting)shabbosTimes.candleLighting=it.date;
      if(it.category==='havdalah'&&!shabbosTimes.havdalah)shabbosTimes.havdalah=it.date;
    });
    if(!isFri&&!isSat&&!candleToday&&!hasHoliday){card.classList.add('hidden');return}
    card.classList.remove('hidden');
    titleEl.textContent=hasHoliday?'Yom Tov Times':'Shabbos Times';
    var htm='',parsha='';
    data.items.forEach(function(it){
      if(it.category==='candles'){htm+='<div class="sitem"><span class="slbl">Candle Lighting</span><span class="stm">'+fmtTime(it.date)+'</span></div>'}
      else if(it.category==='havdalah'){htm+='<div class="sitem"><span class="slbl">Havdalah</span><span class="stm">'+fmtTime(it.date)+'</span></div>'}
      else if(it.category==='parashat'){parsha=it.title||''}
    });
    if(parsha)htm+='<div class="sparsha">'+esc(parsha)+'</div>';
    el.innerHTML=htm||'<span class="err">No times available</span>';
  }).catch(function(){card.classList.add('hidden')});
}
function fetchZmanim(){
  var el=g('zmanim');
  return fetch('https://www.hebcal.com/zmanim?cfg=json&zip='+ZIP).then(function(r){return r.json()}).then(function(d){
    var t=d.times||{};
    var rows=[
      {l:'Alos',v:t.alotHaShachar},
      {l:'Hanetz',v:t.sunrise},
      {l:'Latest Shma',v:t.sofZmanShmaBaalHatanya||t.sofZmanShma},
      {l:'Latest Tefilla',v:t.sofZmanTfilaBaalHatanya||t.sofZmanTfilla},
      {l:'Chatzos',v:t.chatzot},
      {l:'Mincha Gedolah',v:t.minchaGedolaBaalHatanya||t.minchaGedola},
      {l:'Mincha Ketana',v:t.minchaKetanaBaalHatanya||t.minchaKetana},
      {l:'Plag',v:t.plagHaminchaBaalHatanya||t.plagHaMincha},
      {l:'Shkia',v:t.sunset},
      {l:'Tzeis',v:t.tzaisBaalHatanya||t.tzeit72min}
    ].filter(function(r){return r.v});
    el.innerHTML='<div class="zgrid">'+rows.map(function(r){return '<div class="zitem"><span class="zlbl">'+esc(r.l)+'</span><span class="zval">'+fmtTime(r.v)+'</span></div>'}).join('')+'</div>';
  }).catch(function(){el.innerHTML='<span class="err">Unable to load zmanim</span>'});
}
// ---------- Sports live ticker (marquee) ----------
function teamItems(team, icon, name, classKey){
  var out = [];
  if(!team) return out;
  function nameSpan(){return '<span class="t-name '+classKey+'">'+esc(name)+'</span>'}
  if(team.live){
    var g0=team.live;
    var us=(g0.us&&g0.us.score!=null)?g0.us.score:'-';
    var them=(g0.them&&g0.them.score!=null)?g0.them.score:'-';
    var ourLead=Number(us)>Number(them);
    var oppName=(g0.them&&(g0.them.abbr||g0.them.name))||'TBD';
    var prefix=g0.home?'vs':'@';
    var inning=g0.shortDetail||g0.detail||'';
    out.push('<span class="t-item"><span class="t-icon">'+icon+'</span>'+nameSpan()+
      '<span class="t-tag live">LIVE</span>'+
      '<span class="t-score live">'+esc(us)+'&ndash;'+esc(them)+'</span>'+
      '<span class="t-vs">'+esc(prefix)+' '+esc(oppName)+(inning?' &middot; '+esc(inning):'')+'</span></span>');
  }
  function pushGame(g0, label){
    if(!g0) return;
    var oppName=(g0.them&&(g0.them.abbr||g0.them.name))||'TBD';
    var prefix=g0.home?'vs':'@';
    if(g0.completed){
      var us=(g0.us&&g0.us.score!=null)?g0.us.score:'-';
      var them=(g0.them&&g0.them.score!=null)?g0.them.score:'-';
      var won=g0.us&&g0.us.winner;
      var tagClass=won?'win':(g0.us?'loss':'');
      var letter=won?'W':'L';
      out.push('<span class="t-item"><span class="t-icon">'+icon+'</span>'+nameSpan()+
        '<span class="t-tag '+tagClass+'">'+letter+'</span>'+
        '<span class="t-score '+tagClass+'">'+esc(us)+'&ndash;'+esc(them)+'</span>'+
        '<span class="t-vs">'+esc(prefix)+' '+esc(oppName)+'</span>'+
        '<span class="t-when">'+esc(fmtDayTime(g0.date))+'</span></span>');
    } else {
      out.push('<span class="t-item"><span class="t-icon">'+icon+'</span>'+nameSpan()+
        '<span class="t-tag next">'+esc(label||'NEXT')+'</span>'+
        '<span class="t-vs">'+esc(prefix)+' '+esc(oppName)+'</span>'+
        '<span class="t-when">'+esc(fmtDayTime(g0.date))+'</span></span>');
    }
  }
  if(team.todayEvent && (!team.live || team.live.id!==team.todayEvent.id)){pushGame(team.todayEvent,'TODAY')}
  if(team.lastFinal && (!team.todayEvent || team.lastFinal.id!==team.todayEvent.id)){pushGame(team.lastFinal,'LAST')}
  if(team.nextScheduled && (!team.todayEvent || team.nextScheduled.id!==team.todayEvent.id)){pushGame(team.nextScheduled,'NEXT')}
  return out;
}
function buildTickerHtml(d){
  var items=[].concat(
    teamItems(d.dodgers,'&#9918;&#65039;','Dodgers','dodgers'),
    teamItems(d.lakers,'&#127936;','Lakers','lakers')
  );
  if(!items.length) return '<span class="t-empty">No games to show</span>';
  var dot='<span class="t-dot">&bull;</span>';
  var oneRound=items.join(dot);
  // Duplicate for seamless loop. CSS animates -50%, second copy fills in.
  return oneRound + dot + oneRound + dot;
}
function fetchScores(){
  var el=g('scoresTicker');
  return fetch('/api/scores').then(function(r){return r.json()}).then(function(d){
    if(d&&d.error){throw new Error(d.error);}
    el.innerHTML=buildTickerHtml(d);
    var anyLive=(d.dodgers&&d.dodgers.live)||(d.lakers&&d.lakers.live);
    scheduleNextScores(anyLive?SCORES_REFRESH_LIVE:SCORES_REFRESH_IDLE);
  }).catch(function(){
    el.innerHTML='<span class="t-empty">Scores unavailable</span>';
    scheduleNextScores(SCORES_REFRESH_IDLE);
  });
}
function scheduleNextScores(ms){
  if(scoresTimer){clearTimeout(scoresTimer);}
  scoresTimer=setTimeout(fetchScores,ms);
}
function checkShabbosMode(){
  var now=new Date();
  var laD=new Date(now.toLocaleString('en-US',{timeZone:TZ}));
  var dow=laD.getDay();
  var isShabbosOrYT=false;
  if(dow===6){
    if(shabbosTimes.havdalah){
      var hav=new Date(shabbosTimes.havdalah);
      if(now<hav)isShabbosOrYT=true;
    }else{isShabbosOrYT=true}
  }
  if(dow===5&&shabbosTimes.candleLighting){
    var cl=new Date(shabbosTimes.candleLighting);
    if(now>=cl)isShabbosOrYT=true;
  }
  if(hebData&&hebData.events){
    for(var i=0;i<hebData.events.length;i++){
      var ev=hebData.events[i].toLowerCase();
      if(/pesach|sukkot|sukkos|shavuot|shavuos|rosh hashan|yom kippur|shemini atzeret|simchat torah|simchas torah/i.test(ev)&&!/erev|chol hamoed/i.test(ev)){
        isShabbosOrYT=true;break;
      }
    }
  }
  var vid=g('vid'),img=g('vImage');
  if(isShabbosOrYT){
    if(!vid.classList.contains('hidden')){
      vid.classList.add('hidden');
      try{vid.src='about:blank'}catch(e){}
    }
    if(img.classList.contains('hidden')){
      img.classList.remove('hidden');
      img.style.backgroundImage="url('https://i.ytimg.com/vi/vCtCh28Af2w/maxresdefault.jpg')";
      img.innerHTML='<div class="vimg-caption">Shabbat Shalom</div>';
    }
  }else{
    if(img&&!img.classList.contains('hidden')){img.classList.add('hidden');img.innerHTML=''}
    if(vid&&vid.classList.contains('hidden')){
      vid.classList.remove('hidden');
      vid.src='https://www.youtube.com/embed/vCtCh28Af2w?autoplay=1&mute=1&loop=1&playlist=vCtCh28Af2w&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&disablekb=1';
    }
  }
}
function loadAll(){
  return fetchHebDate().then(function(){
    return Promise.all([fetchHY(),fetchLearn(),fetchZmanim(),fetchShabbos()]);
  }).then(function(){
    checkShabbosMode();
    autoScrollAll();
  });
}
loadAll();fetchScores();setInterval(loadAll,REFRESH);
function midnightRefresh(){var now=new Date(),tom=new Date(now);tom.setDate(tom.getDate()+1);tom.setHours(0,0,5,0);setTimeout(function(){loadAll();midnightRefresh()},tom-now)}
midnightRefresh();
})();
