<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Frame</title>
<meta name="theme-color" content="#0d0b09" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%2780%27 font-size=%2780%27>&#128337;</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400&family=Inter:wght@200;300;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0d0b09;position:relative;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;cursor:none}

/* The art fills the panel. The source is exactly 16:9 and so is the screen, so a
   plain stretched <img> is pixel-identical to object-fit:cover -- and needs nothing
   newer than 1998. No transform here: on old TV WebKit a fixed or transformed layer
   can composite to blank, which is exactly how the picture went missing.
   102% with a -1% offset leaves slack for the pixel-shift to move into. */
.art{position:absolute;top:-1%;left:-1%;width:102%;height:102%;display:block;border:0;
  background-color:#0d0b09}

/* A whisper of shade at the bottom so the time reads over any part of the picture. */
.scrim{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
  /* Plain gradient first; a browser that cannot parse the radial keeps this one. */
  background:linear-gradient(to top,rgba(8,6,5,.72) 0%,rgba(8,6,5,.30) 30%,transparent 55%);
  background:radial-gradient(78% 62% at 0% 100%,rgba(8,6,5,.80) 0%,rgba(8,6,5,.55) 26%,rgba(8,6,5,.22) 50%,rgba(8,6,5,.05) 72%,transparent 88%)}

.plate{position:absolute;left:clamp(2.2rem,4.2vw,6.5rem);bottom:clamp(1.8rem,3.6vh,4.5rem);
  color:#f6f1e6;text-shadow:0 .04em .5em rgba(0,0,0,.55),0 .01em .08em rgba(0,0,0,.4)}

.time{display:flex;align-items:baseline;gap:.16em;font-size:clamp(3.6rem,10.5vw,18rem);
  font-weight:200;line-height:.86;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.ampm{font-size:.2em;font-weight:500;letter-spacing:.16em;color:#e4d9c4;
  position:relative;top:-.35em;text-transform:uppercase}

.date{margin-top:clamp(.5rem,1.1vh,1.1rem);font-size:clamp(.95rem,1.85vw,3rem);
  font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:#ece3d2}
.hebdate{margin-top:clamp(.2rem,.5vh,.55rem);font-family:'Heebo',sans-serif;direction:rtl;text-align:left;
  font-size:clamp(.95rem,1.75vw,2.8rem);font-weight:300;color:#d8c9a8;
  /* empty until the Hebrew date resolves, so nothing jumps on load */
  min-height:1em}

/* Fades the whole overlay in once the clock has a real time to show. */
.plate{opacity:0;transition:opacity 1.6s ease-out}
.plate.on{opacity:1}
.artfail{position:fixed;top:1.2rem;left:1.2rem;padding:.4rem .8rem;background:rgba(140,20,20,.85);
  color:#fff;font-size:1rem;letter-spacing:.05em;border-radius:.3rem}
@media(prefers-reduced-motion:reduce){.art,.plate{transition:opacity 1.6s ease-out}}
</style>
</head>
<body>
<img class="art" id="art" src="farbrengen.jpg" alt="" />
<div class="scrim"></div>
<div class="plate" id="plate">
  <div class="time"><span id="hhmm">&nbsp;</span><span class="ampm" id="ampm"></span></div>
  <div class="date" id="date"></div>
  <div class="hebdate" id="hebdate" lang="he"></div>
</div>
<script>
(function(){
// Device local time by default; ?tz=America/New_York to pin it elsewhere.
var TZ=new URLSearchParams(location.search).get('tz')||undefined;
function fmt(opt){return new Intl.DateTimeFormat('en-US',TZ?Object.assign({timeZone:TZ},opt):opt)}
var g=function(id){return document.getElementById(id)};

// The Jewish day turns at nightfall, so from sunset on we show tomorrow's Hebrew
// date. Sunset comes from hebcal once a day for the ZIP below; if it can't be
// reached the date simply turns at midnight instead of being missing.
var ZIP=new URLSearchParams(location.search).get('zip')||'90035';
var sunset=null,sunsetFor='',zipTz=null;
// The Hebrew date is worked out in the ZIP's own timezone, the same one the
// sunset belongs to. Anchoring both to one place is what keeps the rollover from
// landing a day out when the screen itself is set to a different timezone.
function hebTz(){return TZ||zipTz||undefined}
function civilDay(d,tz){
  var o=tz?{timeZone:tz}:{};
  return new Intl.DateTimeFormat('en-CA',o).format(d);
}
function loadSunset(){
  var day=civilDay(new Date(),hebTz());
  if(sunsetFor===day)return;
  sunsetFor=day;
  fetch('https://www.hebcal.com/zmanim?cfg=json&zip='+ZIP+'&date='+day)
    .then(function(r){return r.json()})
    .then(function(d){
      if(d&&d.location&&d.location.tzid)zipTz=d.location.tzid;
      if(d&&d.times&&d.times.sunset){sunset=new Date(d.times.sunset);paint()}
    })
    .catch(function(){sunsetFor=''}); // clear so a later tick retries
}
// Hebrew numerals. Intl renders the Hebrew date with Latin digits ("19 5786"),
// so the day and year are converted here and Intl's own month wording is kept.
var GEM=[[400,'\u05ea'],[300,'\u05e9'],[200,'\u05e8'],[100,'\u05e7'],[90,'\u05e6'],[80,'\u05e4'],
         [70,'\u05e2'],[60,'\u05e1'],[50,'\u05e0'],[40,'\u05de'],[30,'\u05dc'],[20,'\u05db'],
         [10,'\u05d9'],[9,'\u05d8'],[8,'\u05d7'],[7,'\u05d6'],[6,'\u05d5'],[5,'\u05d4'],
         [4,'\u05d3'],[3,'\u05d2'],[2,'\u05d1'],[1,'\u05d0']];
function gematria(n){
  var r=n%1000,s=''; // the year drops its thousands: 5786 -> תשפ״ו
  while(r>0){
    if(r===15){s+='\u05d8\u05d5';break}   // 15 and 16 are written טו / טז,
    if(r===16){s+='\u05d8\u05d6';break}   // never with the Divine Name
    for(var i=0;i<GEM.length;i++){if(GEM[i][0]<=r){s+=GEM[i][1];r-=GEM[i][0];break}}
  }
  return s.length===1?s+'\u05f3':s.slice(0,-1)+'\u05f4'+s.slice(-1);
}
function hebrewDate(now){
  var d=(sunset&&now>=sunset)?new Date(now.getTime()+86400000):now;
  try{
    var o={day:'numeric',month:'long',year:'numeric'},tz=hebTz();
    if(tz)o.timeZone=tz;
    return new Intl.DateTimeFormat('he-u-ca-hebrew',o).formatToParts(d).map(function(pt){
      return (pt.type==='day'||pt.type==='year')?gematria(+pt.value):pt.value;
    }).join('');
  }catch(e){return ''}
}

function paint(){
  var now=new Date();
  var t=fmt({hour:'numeric',minute:'2-digit',hour12:true}).format(now); // "9:33 AM"
  var parts=t.split(' ');
  g('hhmm').textContent=parts[0];
  g('ampm').textContent=parts[1]||'';
  g('date').textContent=fmt({weekday:'long',month:'long',day:'numeric'}).format(now);
  g('hebdate').textContent=hebrewDate(now);
  g('plate').classList.add('on');
}
// Tick exactly on the minute rather than drifting off a fixed interval.
function schedule(){
  loadSunset();
  paint();
  var now=new Date();
  setTimeout(schedule,(60-now.getSeconds())*1000-now.getMilliseconds()+50);
}
schedule();

// Pixel-shift. Every few minutes the picture and the clock inch to a new spot
// (over a 90s transition, so the eye never catches it) -- the same trick the
// Frame's own art mode uses to keep a still image from marking the panel.
var step=0;
function drift(){
  step++;
  var a=step*0.7;                       // walks slowly around an ellipse
  var dx=Math.cos(a),dy=Math.sin(a*1.3);
  // Margins, not transforms -- nothing gets promoted to its own layer.
  g('art').style.marginLeft=(dx*5).toFixed(0)+'px';
  g('art').style.marginTop=(dy*5).toFixed(0)+'px';
  g('plate').style.marginLeft=(dx*9).toFixed(0)+'px';
  g('plate').style.marginBottom=(dy*7).toFixed(0)+'px';
}
setInterval(drift,180000); // every 3 minutes

// Keep the panel awake. A silent looping <video> used to sit here as a second
// line of defence for TV browsers that ignore the Wake Lock API. It is gone: it
// was what blanked the picture. Samsung composites video onto a hardware plane
// behind the page and punches a transparent hole through to show it, so a video
// at z-index:-1 turned everything behind the clock black. This browser reports
// Chrome 120 and honours the wake lock on its own.
var lock=null;
function wake(){
  if(!('wakeLock' in navigator))return;
  navigator.wakeLock.request('screen').then(function(l){
    lock=l;l.addEventListener('release',function(){lock=null});
  }).catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){if(lock===null)wake();paint()}
});
wake();

// If the art cannot be fetched, say so instead of showing a black panel.
// (This probe was previously spliced into the visibilitychange handler by a bad
// edit, so it never ran on load -- which is why no warning ever appeared.)
(function(){
  var probe=new Image();
  probe.onerror=function(){
    var n=document.createElement('div');
    n.className='artfail';
    n.textContent='farbrengen.jpg did not load';
    document.body.appendChild(n);
  };
  probe.src='farbrengen.jpg';
})();

// A tap or click anywhere goes full screen (browsers only allow it from a gesture).
document.addEventListener('click',function(){
  if(document.fullscreenElement)return;
  var el=document.documentElement;
  (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
});
})();
</script>
</body>
</html>
